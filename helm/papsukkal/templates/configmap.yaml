apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "name" . }}-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "labels" . | trim | nindent 4 }}
data:
  # Per-environment configuration, rendered from env/values-kub-ent-*.yaml. Mounted and overlaid on
  # the baked application.yml via -Dspring.config.additional-location (see the CronJob). Secrets are
  # NOT here — they arrive as env vars from the External Secrets (envFrom).
  application.properties: |-
    papsukkal.entur.client-name={{ .Values.config.enturClientName }}
    papsukkal.entur.url={{ .Values.config.enturFareZoneUrl }}
    papsukkal.gcs.project-id={{ .Values.config.gcsProjectId }}
    papsukkal.gcs.bucket={{ .Values.config.gcsStateBucket }}
    papsukkal.tiamat.url={{ .Values.config.tiamatImportUrl }}
    papsukkal.tiamat.import-type={{ .Values.config.tiamatImportType }}
    papsukkal.tiamat.oauth.audience={{ .Values.config.oauthAudience }}
    spring.security.oauth2.client.provider.tiamat.token-uri={{ .Values.config.oauthTokenUri }}
    logging.structured.format.console=no.entur.papsukkal.logging.GcpStructuredLogFormatter
