{{- /*
  Generic External Secrets: one ExternalSecret per entry in .Values.secrets, syncing the listed
  keys from the namespace SecretStore (Google Secret Manager) with secretKey == remote key.
  Mirrors kakka/templates/external-secret.yaml.
*/ -}}
{{- range $secretName, $keys := .Values.secrets }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $secretName }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "labels" $ | trim | nindent 4 }}
  annotations:
    timestamp: {{ now | date "2006-01-02T15:04:05" }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: {{ $.Release.Namespace }}
  target:
    name: {{ $secretName }}
    creationPolicy: Owner
  data:
  {{- range $keys }}
  - secretKey: {{ . }}
    remoteRef:
      key: {{ . }}
  {{- end }}
---
{{- end }}
