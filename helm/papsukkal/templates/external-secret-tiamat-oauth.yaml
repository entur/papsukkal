{{- /*
  Tiamat OAuth2 client-credentials, mapped from the provisioned remote keys to the Spring-canonical
  env names (relaxed binding → spring.security.oauth2.client.registration.tiamat.client-id/secret).
  Mirrors kakka/templates/external-secrets-auth0.yaml, where the remote key name differs from the
  desired env var name.
*/ -}}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.tiamatOauth.secretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "labels" . | trim | nindent 4 }}
  annotations:
    timestamp: {{ now | date "2006-01-02T15:04:05" }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: {{ .Release.Namespace }}
  target:
    name: {{ .Values.tiamatOauth.secretName }}
    creationPolicy: Owner
  data:
  - secretKey: SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_TIAMAT_CLIENT_ID
    remoteRef:
      key: {{ .Values.tiamatOauth.clientIdRemoteKey }}
  - secretKey: SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_TIAMAT_CLIENT_SECRET
    remoteRef:
      key: {{ .Values.tiamatOauth.clientSecretRemoteKey }}
