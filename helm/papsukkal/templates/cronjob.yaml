{{- $releaseName := include "name" . -}}
{{- $cron := .Values.cron -}}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ $releaseName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "labels" . | trim | nindent 4 }}
  annotations:
    {{- include "annotations" . | trim | nindent 4 }}
spec:
  {{- $unused := required "cron.schedule is required" $cron.schedule }}
  schedule: {{ $cron.schedule | quote }}
  # Not exposed by the common chart — defined locally so the schedule is in Europe/Oslo.
  timeZone: {{ $cron.timeZone | quote }}
  concurrencyPolicy: {{ $cron.concurrencyPolicy | default "Forbid" }}
  successfulJobsHistoryLimit: {{ $cron.successfulJobsHistoryLimit | default 3 }}
  failedJobsHistoryLimit: {{ $cron.failedJobsHistoryLimit | default 3 }}
  suspend: {{ $cron.suspend | default false }}
  jobTemplate:
    metadata:
      annotations:
        cluster-autoscaler.kubernetes.io/safe-to-evict: "true"
      labels:
        {{- include "labels" . | indent 8 }}
    spec:
      # Not exposed by the common chart — 0 means no in-cluster re-run; the next daily tick is the
      # outer retry (within-run transient retries are handled by Spring Retry).
      backoffLimit: {{ $cron.backoffLimit | default 0 }}
      activeDeadlineSeconds: {{ $cron.activeDeadlineSeconds | default 1800 }}
      template:
        metadata:
          annotations:
            {{- include "annotations" . | indent 12 }}
          labels:
            {{- include "labels" . | indent 12 }}
        spec:
          # The "application" service account is created by the infrastructure provisioner
          # (Workload Identity bound to GCS); the chart does not manage it.
          serviceAccountName: application
          restartPolicy: {{ $cron.restartPolicy | default "Never" }}
          dnsPolicy: ClusterFirst
          terminationGracePeriodSeconds: 30
          securityContext:
            runAsNonRoot: true
            runAsUser: {{ .Values.uid }}
            runAsGroup: {{ .Values.uid }}
            fsGroup: {{ .Values.uid }}
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: {{ .Values.app }}
              image: {{ .Values.image.identifier }}
              imagePullPolicy: {{ .Values.image.imagePullPolicy | default "Always" }}
              env:
                - name: TZ
                  value: Europe/Oslo
                # Overlay the per-env ConfigMap (mounted below) on the baked application.yml.
                - name: JDK_JAVA_OPTIONS
                  value: >-
                    -XX:MaxRAMPercentage=75.0
                    -Dfile.encoding=UTF-8
                    -Dspring.config.additional-location=file:/etc/application-config/application.properties
                # Force a full resync AND override the validation gateway
                - name: FORCE
                  value: {{ .Values.config.forceResync | default "false" }}
              envFrom:
                # SLACK_URL + the SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_TIAMAT_* creds,
                # synced from the namespace SecretStore by the ExternalSecrets (see external-secret*.yaml).
                {{- range $secretName, $keys := .Values.secrets }}
                - secretRef:
                    name: {{ $secretName }}
                {{- end }}
                - secretRef:
                    name: {{ .Values.tiamatOauth.secretName }}
              resources:
                requests:
                  cpu: {{ .Values.resources.cpu | quote }}
                  memory: {{ .Values.resources.memory | quote }}
                limits:
                  memory: {{ .Values.resources.memory | quote }}
              {{- include "securitycontext" . | nindent 14 }}
              volumeMounts:
                - name: application-config
                  mountPath: /etc/application-config
                  readOnly: true
                # readOnlyRootFilesystem=true → give the JVM a writable scratch dir (java.io.tmpdir).
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: application-config
              configMap:
                name: {{ $releaseName }}-config
            - name: tmp
              emptyDir:
                sizeLimit: 64Mi
