spring:
  application:
    name: papsukkal
  main:
    # Run-once batch job — no web server.
    web-application-type: none
    banner-mode: "off"
  security:
    oauth2:
      client:
        registration:
          tiamat:
            authorization-grant-type: client_credentials
            # client-id / client-secret come from the SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_TIAMAT_*
            # env vars (papsukkal-tiamat-oauth ExternalSecret); provider.tiamat.token-uri comes from the
            # mounted ConfigMap (see helm/papsukkal).

# Structural defaults only. Per-environment values (GCS project/bucket, Tiamat URL + OAuth
# token-uri/audience, logging format) are supplied at deploy time via the mounted
# application.properties ConfigMap; secrets (SLACK_URL, OAuth client id/secret) arrive as env vars.
papsukkal:
  entur:
    url: https://api.entur.io/distance/netex/fare-zones
    # ET-Client-Name header default; overridden per deployment.
    client-name: entur-papsukkal
    # organisation-id:   # optional filter; omit for the full ("all") export
  gcs:
    object-name: sync-state/last-sync.json
  slack:
    # Incoming-webhook URL from the SLACK_URL secret. Blank disables notifications (best-effort).
    webhook-url: ${SLACK_URL:}
  tiamat:
    oauth:
      client-registration-id: tiamat
    retry:
      max-retries: 2        # 3 attempts total
      delay: 5s
      multiplier: 3.0
      max-delay: 45s
      jitter: 1s
  validation:
    # Floors tuned to the known-good magnitude of the production export (≈485 zones / 29 groups).
    # NOT `> 0`: Tiamat self-guards the empty delivery; the small-but-nonzero delivery is the danger.
    fare-zone:
      min-count: 400
    group:
      min-count: 25
    # Fail-closed on any shrink beyond this percentage vs the last-good baseline.
    max-shrink-pct: 10

logging:
  level:
    no.entur.papsukkal: INFO
